<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>颜值检测系统</title>
    <link rel="stylesheet" href="style.css">
    <!-- 引入图标库（美化按钮和标题） -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <h1><i class="fas fa-camera-retro"></i> 颜值检测系统</h1>
        
        <!-- 检测区域 -->
        <div class="detect-area">
            <div class="video-container">
                <video id="video" autoplay playsinline></video>
                <canvas id="canvas" hidden></canvas>
                <!-- 拍摄倒计时提示 -->
                <div id="countdown" class="countdown hidden"></div>
            </div>
            <button id="startBtn" class="btn-primary"><i class="fas fa-play"></i> 开始检测（自动连拍5张）</button>
            <!-- 评分卡片 -->
            <div id="scoreCard" class="score-card hidden">
                <h3>检测结果 <i class="fas fa-star"></i></h3>
                <div id="scoreDisplay" class="score"></div>
                <div id="scoreDesc" class="score-desc"></div>
            </div>
            <div id="photoTip" class="photo-tip">已拍照片数：<span id="photoNum">0</span> 张</div>
        </div>

        <!-- 相册入口 -->
        <div class="album-entry">
            <button id="albumBtn" class="btn-secondary"><i class="fas fa-images"></i> 进入本地相册</button>
            <div id="passwordModal" class="modal hidden">
                <input type="password" id="passwordInput" placeholder="输入相册密码">
                <button id="verifyBtn" class="btn-primary">验证</button>
                <div id="passwordTip">密码提示：54188</div>
            </div>
        </div>

        <!-- 公共相册（默认隐藏） -->
        <div id="album" class="album hidden">
            <div class="album-header">
                <h2><i class="fas fa-book-open"></i> 公共相册</h2>
                <button id="closeAlbum" class="btn-close"><i class="fas fa-times"></i></button>
            </div>
            <div id="photoList" class="photo-list"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
